<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue & Vitrine - Produits</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- En-tête -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-900">Ma Vitrine</h1>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Grille des produits avec une taille maximale contrôlée -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Script de chargement Google Sheets -->
    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTyVae43j0MEpWVeD2aoUIdOpE6QzgVPefeP5k0SCYnwvPGOJIuUqxEx4NIYY8jfXioJgrUpcEHH2uh/pub?output=csv";

        Papa.parse(csvUrl, {
            download: true, 
            header: true, 
            skipEmptyLines: true,
            complete: function(results) {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = ''; // Nettoie tout résidu
                
                results.data.forEach(product => {
                    const nom = product.nom || '';
                    const prix = product.prix || '';
                    const image = product.image || '';

                    const card = document.createElement('div');
                    card.className = "product-card bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col max-w-sm w-full";
                    card.innerHTML = `
                        <div class="bg-slate-100 h-52 overflow-hidden flex items-center justify-center">
                            <img src="${image}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=500&q=80'">
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <h3 class="font-semibold text-sm text-slate-900">${nom}</h3>
                            <p class="font-bold text-slate-900 mt-2">${prix}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
