<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue & Vitrine - Produits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-900">Ma Vitrine</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-16 text-slate-400">Chargement...</div>
        </div>
    </main>

    <script>
        Papa.parse("stock.csv", {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';
                results.data.forEach(product => {
                    const card = document.createElement('div');
                    card.className = "product-card bg-white rounded-2xl border border-slate-200 overflow-hidden";
                    card.innerHTML = `
                        <div class="bg-slate-100 h-52"><img src="${product.image}" class="w-full h-full object-cover"></div>
                        <div class="p-4"><h3 class="font-semibold text-sm">${product.nom}</h3><p class="font-bold mt-2">${product.prix}</p></div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
