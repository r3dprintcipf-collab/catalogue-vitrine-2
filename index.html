<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINTDESIGN.CI | Studio & Vente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #171717; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="pb-20">

    <!-- Navigation -->
    <nav class="sticky top-0 bg-white/95 backdrop-blur-sm border-b border-gray-100 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tighter uppercase">PrintDesign.ci</h1>
            <input type="text" id="search" placeholder="Rechercher..." 
                   class="bg-gray-50 border-0 rounded-full px-4 py-1.5 text-sm w-32 sm:w-64 focus:ring-2 focus:ring-black outline-none transition">
        </div>
    </nav>

    <!-- Header -->
    <header class="max-w-5xl mx-auto px-6 py-12">
        <h2 class="text-4xl font-semibold">Catalogue</h2>
        <p class="text-gray-500 mt-2" id="count">Chargement du stock...</p>
    </header>

    <!-- Grille -->
    <main class="max-w-5xl mx-auto px-6">
        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8"></div>
    </main>

    <script>
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTyVae43j0MEpWVeD2aoUIdOpE6QzgVPefeP5k0SCYnwvPGOJIuUqxEx4NIYY8jfXioJgrUpcEHH2uh/pub?output=csv";
        let data = [];

        Papa.parse(url, { download: true, header: true, complete: (res) => {
            data = res.data;
            render(data);
        }});

        function render(items) {
            const grid = document.getElementById('grid');
            document.getElementById('count').textContent = `${items.length} articles disponibles`;
            grid.innerHTML = items.map(p => `
                <div class="group cursor-pointer">
                    <div class="aspect-square bg-gray-100 rounded-2xl overflow-hidden mb-3">
                        <img src="${p.image}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" 
                             onerror="this.src='https://images.unsplash.com/photo-1581091226825-a6a2a5aee158'">
                    </div>
                    <div class="px-1">
                        <h3 class="text-sm font-medium truncate">${p.nom}</h3>
                        <p class="text-xs text-gray-400 mb-1">${p.couleur || 'Standard'}</p>
                        <p class="text-sm font-semibold">${p.prix}</p>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            render(data.filter(p => p.nom.toLowerCase().includes(q) || (p.couleur && p.couleur.toLowerCase().includes(q))));
        });
    </script>
</body>
</html>
