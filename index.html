<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINTDESIGN.CI - Catalogue Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; }
        .product-card { transition: all 0.25s ease-in-out; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white">

    <!-- En-tête fixe et ergonomique -->
    <header class="bg-white/80 backdrop-blur-md border-b border-neutral-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-neutral-900"></span>
                <span class="text-base sm:text-lg font-bold tracking-tight">PRINTDESIGN.CI</span>
            </div>
            <div class="w-48 sm:w-80 relative">
                <input type="text" id="search" placeholder="Rechercher..." 
                       class="w-full bg-neutral-100 border border-transparent rounded-full px-4 py-2 text-xs sm:text-sm focus:bg-white focus:border-neutral-300 focus:outline-none transition">
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
        <div class="flex items-center justify-between mb-6 sm:mb-8">
            <h2 class="text-base sm:text-xl font-bold tracking-tight">Catalogue des produits</h2>
            <span id="productCount" class="text-xs sm:text-sm font-medium text-neutral-500">Chargement...</span>
        </div>

        <!-- Grille adaptée mobile (2 colonnes sur petits écrans, 3 ou 4 sur PC) -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6"></div>
    </main>

    <!-- Script de synchronisation Google Sheets -->
    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTyVae43j0MEpWVeD2aoUIdOpE6QzgVPefeP5k0SCYnwvPGOJIuUqxEx4NIYY8jfXioJgrUpcEHH2uh/pub?output=csv";
        let allProducts = [];

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allProducts = results.data;
                renderProducts(allProducts);
            }
        });

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            const count = document.getElementById('productCount');
            
            grid.innerHTML = '';
            count.textContent = `${items.length} article${items.length > 1 ? 's' : ''}`;

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-neutral-400 text-sm">Aucun produit trouvé.</div>`;
                return;
            }

            items.forEach(product => {
                const nom = product.nom || 'Produit sans nom';
                const couleur = product.couleur ? product.couleur.trim() : '';
                const prix = product.prix || '';
                const image = product.image || '';

                const card = document.createElement('div');
                card.className = "product-card bg-white rounded-xl sm:rounded-2xl border border-neutral-200/80 overflow-hidden flex flex-col";
                card.innerHTML = `
                    <div class="bg-neutral-100 h-40 sm:h-64 w-full overflow-hidden relative">
                        <img src="${image}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=500&q=80'">
                        ${couleur ? `<span class="absolute top-2 right-2 sm:top-3 sm:right-3 bg-white/90 backdrop-blur-sm text-neutral-800 text-[10px] sm:text-xs font-semibold px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full shadow-sm">${couleur}</span>` : ''}
                    </div>
                    <div class="p-3 sm:p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-medium text-neutral-900 text-xs sm:text-sm leading-snug line-clamp-2">${nom}</h3>
                        </div>
                        <div class="mt-3 sm:mt-4 pt-3 sm:pt-4 border-t border-neutral-100 flex items-center justify-between">
                            <span class="text-xs sm:text-base font-bold text-neutral-900">${prix}</span>
                            <span class="text-[10px] sm:text-xs font-medium text-neutral-400 uppercase tracking-wider hidden sm:inline">Disponible</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = allProducts.filter(p => 
                (p.nom && p.nom.toLowerCase().includes(term)) || 
                (p.couleur && p.couleur.toLowerCase().includes(term))
            );
            renderProducts(filtered);
        });
    </script>
</body>
</html>
